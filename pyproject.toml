[tool.ruff]
select = ["E", "F", "B", "C90"]        # pycodestyle, pyflakes, bugbear, complexity
ignore = ["E203", "W503"]                # Whitespace not often caught by Black
max-line-length = 88

[tool.ruff.flake8]
# Enable any Flake8 plugins you need (import-order, docstrings, etc.)
extend-select = [] 