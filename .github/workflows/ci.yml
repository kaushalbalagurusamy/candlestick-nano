name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install Linting Tools
        run: pip install ruff flake8
      - name: Run Ruff
        run: ruff .
      - name: Run Flake8
        run: flake8 .

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install Test Dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio
      - name: Run Tests
        run: pytest -q

  pylint:
    name: Pylint
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install Pylint
        run: pip install pylint
      - name: Run Pylint
        run: pylint .

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    needs: pylint
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install Mypy
        run: pip install mypy
      - name: Run Mypy
        run: mypy .

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: type-check
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install Bandit
        run: pip install bandit
      - name: Run Bandit
        run: bandit -r . 