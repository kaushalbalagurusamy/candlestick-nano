version: '3.8'

services:
  buy-monitor:
    build: .
    container_name: candlestick-buy-monitor
    command: ["python3", "src/entry_daemon.py"]
    environment:
      - SOLANA_CLUSTER=devnet
      - SERVICE_NAME=buy-monitor
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    env_file:
      - config/.envrc
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "print('healthy')"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  exit-monitor:
    build: .
    container_name: candlestick-exit-monitor
    command: ["python3", "src/exit_daemon.py"]
    environment:
      - SOLANA_CLUSTER=devnet
      - SERVICE_NAME=exit-monitor
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    env_file:
      - config/.envrc
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "print('healthy')"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  combined-daemon:
    build: .
    container_name: candlestick-combined
    command: ["python3", "src/combined_daemon.py"]
    environment:
      - SOLANA_CLUSTER=devnet
      - SERVICE_NAME=combined-daemon
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    env_file:
      - config/.envrc
    restart: unless-stopped
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "print('healthy')"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  claude-cli:
    build: .
    container_name: candlestick-claude-cli
    command: ["tail", "-f", "/dev/null"]  # Keep container running
    environment:
      - SOLANA_CLUSTER=devnet
      - SERVICE_NAME=claude-cli
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - NODE_ENV=development
    env_file:
      - config/.envrc
    volumes:
      # Mount the entire project for development
      - .:/home/claude/workspace:cached
      # Persist Claude configuration
      - claude-config:/home/claude/.anthropic
      - claude-cache:/home/claude/.claude
      # Persist shell history and config
      - claude-home:/home/claude/.zsh_history
    working_dir: /home/claude/workspace
    profiles:
      - claude  # Only start when specifically requested
    stdin_open: true
    tty: true
    user: "1000:100"  # Match the claude user from Dockerfile
    init: true  # Proper signal handling

volumes:
  claude-config:
    driver: local
  claude-cache:
    driver: local
  claude-home:
    driver: local 