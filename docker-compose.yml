version: '3.8'

services:
  buy-monitor:
    build: .
    container_name: candlestick-buy-monitor
    command: ["python", "src/entry_daemon.py"]
    environment:
      - AWS_REGION=us-west-2
      - SERVICE_NAME=buy-monitor
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    env_file:
      - config/.envrc
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "print('healthy')"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  exit-monitor:
    build: .
    container_name: candlestick-exit-monitor
    command: ["python", "src/exit_daemon.py"]
    environment:
      - AWS_REGION=us-west-2
      - SERVICE_NAME=exit-monitor
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    env_file:
      - config/.envrc
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "print('healthy')"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  combined-daemon:
    build: .
    container_name: candlestick-combined
    command: ["python", "src/combined_daemon.py"]
    environment:
      - AWS_REGION=us-west-2
      - SERVICE_NAME=combined-daemon
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    env_file:
      - config/.envrc
    restart: unless-stopped
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "print('healthy')"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  claude-cli:
    build: .
    container_name: candlestick-claude-cli
    command: ["tail", "-f", "/dev/null"]  # Keep container running
    environment:
      - AWS_REGION=us-west-2
      - SERVICE_NAME=claude-cli
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    env_file:
      - config/.envrc
    volumes:
      - .:/app
      - ~/.anthropic:/home/app/.anthropic  # Mount Claude config directory
    working_dir: /app
    profiles:
      - claude  # Only start when specifically requested
    stdin_open: true
    tty: true 