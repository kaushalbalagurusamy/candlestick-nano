services:
  combined-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: candlestick-combined
    restart: unless-stopped
    command: ["python3", "src/combined_daemon.py"]
    environment:
      - SOLANA_CLUSTER=devnet
      - SERVICE_NAME=combined-daemon
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  entry-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: candlestick-entry-daemon
    restart: unless-stopped
    command: ["python3", "src/entry_daemon.py"]
    environment:
      - SOLANA_CLUSTER=devnet
      - SERVICE_NAME=entry-daemon
    profiles:
      - standalone
    healthcheck:
      test: ["CMD", "python3", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  exit-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: candlestick-exit-daemon
    restart: unless-stopped
    command: ["python3", "src/exit_daemon.py"]
    environment:
      - SOLANA_CLUSTER=devnet
      - SERVICE_NAME=exit-monitor
    profiles:
      - standalone
    healthcheck:
      test: ["CMD", "python3", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
